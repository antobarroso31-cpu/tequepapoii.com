<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="logoYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE84D" />
      <stop offset="100%" stop-color="#F5B800" />
    </linearGradient>
    <linearGradient id="logoDenim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="cheeseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25" flood-color="#0F172A" />
    </filter>
  </defs>

  <!-- Mascot Badge Circle -->
  <g filter="url(#shadow)" transform="translate(10, 5)">
    <!-- Outer ring -->
    <circle cx="55" cy="55" r="50" fill="url(#logoDenim)" stroke="#FFE84D" stroke-width="4" />
    
    <!-- Minion Head in Badge -->
    <rect x="25" y="24" width="60" height="65" rx="30" fill="url(#logoYellow)" />
    <!-- Chef Hat -->
    <path d="M 37 26 C 35 12, 45 10, 55 10 C 65 10, 75 12, 73 26 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <path d="M 40 20 C 45 6, 65 6, 70 20" fill="#FFFFFF" />
    <rect x="36" y="22" width="38" height="6" rx="2" fill="#F1F5F9" />

    <!-- Goggle Strap -->
    <rect x="25" y="46" width="60" height="7" fill="#1F2937" />
    
    <!-- Big Goggle Center Eye -->
    <circle cx="55" cy="49" r="17" fill="#9CA3AF" stroke="#374151" stroke-width="2.5" />
    <circle cx="55" cy="49" r="13" fill="#FFFFFF" />
    <circle cx="55" cy="49" r="8" fill="#78350F" />
    <circle cx="55" cy="49" r="4" fill="#0F172A" />
    <circle cx="58" cy="47" r="2" fill="#FFFFFF" />
    
    <!-- Happy Smile with Cheese Drool -->
    <path d="M 42 70 Q 55 82 68 70" stroke="#78350F" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 64 74 Q 67 82 65 85" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 20)">
    <!-- Main Title "TEQUEÑOS" -->
    <text x="0" y="38" font-family="'Fredoka', 'Poppins', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="36" fill="#0F172A" letter-spacing="1.5">
      TEQUEÑOS
    </text>
    
    <!-- Badge for "EL PAPOI" -->
    <rect x="185" y="6" width="185" height="40" rx="10" fill="url(#logoYellow)" stroke="#B45309" stroke-width="2" filter="url(#shadow)" />
    <text x="277" y="34" font-family="'Fredoka', 'Poppins', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#1E3A8A" text-anchor="middle" letter-spacing="2">
      EL PAPOI!
    </text>

    <!-- Cheese wave underline -->
    <path d="M 0 54 Q 60 62 120 54 T 240 54 T 360 54" stroke="url(#cheeseGradient)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Subtitle / Tagline -->
    <text x="2" y="78" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#4B5563" letter-spacing="1">
      🧀 100% QUESO DERRETIDO · 🍌 CRUJIENTES &amp; DIVERTIDOS · 🇻🇪 RECETA ARTESANAL
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="tcGold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FEF9C3" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle cx="160" cy="110" r="100" fill="#FEF3C7" opacity="0.5" />

  <!-- Wooden Board Plate -->
  <ellipse cx="160" cy="140" rx="140" ry="50" fill="#78350F" opacity="0.15" />
  <ellipse cx="160" cy="135" rx="135" ry="46" fill="#FDE68A" stroke="#D97706" stroke-width="2" />

  <!-- Tequeño 1 (Bottom) -->
  <g transform="translate(60, 95) rotate(-8)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="url(#tcGold)" stroke="#92400E" stroke-width="2" />
    <path d="M 30 0 Q 42 19 54 38" stroke="#78350F" stroke-width="2.5" fill="none" />
    <path d="M 70 0 Q 82 19 94 38" stroke="#78350F" stroke-width="2.5" fill="none" />
    <path d="M 110 0 Q 122 19 134 38" stroke="#78350F" stroke-width="2.5" fill="none" />
    <path d="M 150 0 Q 158 19 166 38" stroke="#78350F" stroke-width="2" fill="none" />
  </g>

  <!-- Tequeño 2 (Crossed on Top with Melted Cheese) -->
  <g transform="translate(70, 75) rotate(12)">
    <rect x="0" y="0" width="170" height="38" rx="19" fill="url(#tcGold)" stroke="#92400E" stroke-width="2" />
    <path d="M 25 0 Q 37 19 49 38" stroke="#78350F" stroke-width="2.5" fill="none" />
    <path d="M 65 0 Q 77 19 89 38" stroke="#78350F" stroke-width="2.5" fill="none" />
    <path d="M 105 0 Q 117 19 129 38" stroke="#78350F" stroke-width="2.5" fill="none" />
    <path d="M 145 0 Q 152 19 160 38" stroke="#78350F" stroke-width="2" fill="none" />
    <!-- Cheesy oozing tip -->
    <ellipse cx="166" cy="19" rx="10" ry="16" fill="#FEF08A" stroke="#EAB308" stroke-width="1.5" />
    <path d="M 172 19 Q 185 24 178 35 Q 172 26 168 24" fill="#FEF08A" />
  </g>

  <!-- Sauce Cup -->
  <g transform="translate(210, 80)">
    <ellipse cx="25" cy="40" rx="25" ry="10" fill="#CBD5E1" />
    <path d="M 0 25 L 5 45 C 5 50, 45 50, 45 45 L 50 25 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.5" />
    <ellipse cx="25" cy="25" rx="25" ry="10" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1" />
    <circle cx="22" cy="24" r="2" fill="#16A34A" />
    <circle cx="28" cy="27" r="1.5" fill="#16A34A" />
  </g>

  <!-- Minion Eye badge / Seal of freshness -->
  <g transform="translate(30, 20)">
    <circle cx="24" cy="24" r="22" fill="#2563EB" stroke="#FFE033" stroke-width="3" />
    <circle cx="24" cy="24" r="14" fill="#9CA3AF" />
    <circle cx="24" cy="24" r="10" fill="#FFFFFF" />
    <circle cx="24" cy="24" r="5" fill="#78350F" />
    <circle cx="24" cy="24" r="2.5" fill="#0F172A" />
    <circle cx="25" cy="23" r="1" fill="#FFFFFF" />
  </g>
</svg>

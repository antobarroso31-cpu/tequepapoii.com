<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="minionYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="100%" stop-color="#F5B800" />
    </linearGradient>
    <linearGradient id="tequenoGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="denimBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>
  <!-- Mascot Head / Pill Shape -->
  <rect x="15" y="10" width="70" height="75" rx="35" fill="url(#minionYellow)" stroke="#B45309" stroke-width="2" />
  
  <!-- Goggle Strap -->
  <rect x="15" y="38" width="70" height="8" fill="#1F2937" />
  
  <!-- Left Eye Goggle -->
  <circle cx="38" cy="42" r="16" fill="#9CA3AF" stroke="#374151" stroke-width="2.5" />
  <circle cx="38" cy="42" r="12" fill="#E5E7EB" />
  <circle cx="38" cy="42" r="7" fill="#6B4226" />
  <circle cx="38" cy="42" r="3.5" fill="#111827" />
  <circle cx="40" cy="40" r="1.5" fill="#FFFFFF" />

  <!-- Right Eye Goggle -->
  <circle cx="62" cy="42" r="16" fill="#9CA3AF" stroke="#374151" stroke-width="2.5" />
  <circle cx="62" cy="42" r="12" fill="#E5E7EB" />
  <circle cx="62" cy="42" r="7" fill="#6B4226" />
  <circle cx="62" cy="42" r="3.5" fill="#111827" />
  <circle cx="64" cy="40" r="1.5" fill="#FFFFFF" />

  <!-- Tequeño in Smile -->
  <g transform="rotate(-6 50 68)">
    <!-- Golden Tequeño Body -->
    <rect x="25" y="65" width="50" height="12" rx="6" fill="url(#tequenoGold)" stroke="#92400E" stroke-width="1.5" />
    <!-- Pastry spirals -->
    <path d="M 33 65 Q 36 71 39 77" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 43 65 Q 46 71 49 77" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 53 65 Q 56 71 59 77" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 63 65 Q 66 71 69 77" stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Melty cheese tip -->
    <circle cx="25" cy="71" r="4.5" fill="#FEF08A" stroke="#EAB308" stroke-width="1" />
  </g>
</svg>
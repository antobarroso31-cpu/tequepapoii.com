<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="yellowSkinR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE54D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="denimBlueR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="ownerShadowR" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.18" flood-color="#000" />
    </filter>
  </defs>

  <g filter="url(#ownerShadowR)">
    <!-- Rounder, Cute Body (Bob style) -->
    <rect x="48" y="75" width="104" height="125" rx="52" fill="url(#yellowSkinR)" stroke="#B45309" stroke-width="2.5" />

    <!-- Cute Sprout of Hair -->
    <path d="M 98 75 Q 92 50 82 55" stroke="#451A03" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 102 75 Q 108 48 118 53" stroke="#451A03" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Goggle Strap -->
    <rect x="48" y="102" width="104" height="12" fill="#1F2937" />

    <!-- Eyes (Heterochromia: green & brown eyes like Bob!) -->
    <!-- Left Eye (Green) -->
    <circle cx="78" cy="108" r="18" fill="#9CA3AF" stroke="#374151" stroke-width="3" />
    <circle cx="78" cy="108" r="13" fill="#FFFFFF" />
    <circle cx="78" cy="108" r="7" fill="#16A34A" />
    <circle cx="78" cy="108" r="3.5" fill="#0F172A" />
    <circle cx="80" cy="106" r="1.5" fill="#FFFFFF" />

    <!-- Right Eye (Brown) -->
    <circle cx="122" cy="108" r="18" fill="#9CA3AF" stroke="#374151" stroke-width="3" />
    <circle cx="122" cy="108" r="13" fill="#FFFFFF" />
    <circle cx="122" cy="108" r="7" fill="#78350F" />
    <circle cx="122" cy="108" r="3.5" fill="#0F172A" />
    <circle cx="124" cy="106" r="1.5" fill="#FFFFFF" />

    <!-- Cheek Blush -->
    <circle cx="66" cy="132" r="7" fill="#F43F5E" opacity="0.35" />
    <circle cx="134" cy="132" r="7" fill="#F43F5E" opacity="0.35" />

    <!-- Wide Happy Smile with Tongue -->
    <path d="M 82 136 Q 100 156 118 136 Z" fill="#991B1B" stroke="#78350F" stroke-width="2" />
    <path d="M 92 146 Q 100 140 108 146 Q 100 154 92 146" fill="#F43F5E" />

    <!-- Denim Overalls -->
    <path d="M 48 160 L 48 195 C 48 210, 60 215, 100 215 C 140 215, 152 210, 152 195 L 152 160 Z" fill="url(#denimBlueR)" stroke="#1E3A8A" stroke-width="2" />
    <rect x="74" y="150" width="52" height="38" rx="4" fill="url(#denimBlueR)" />
    <!-- Straps -->
    <path d="M 56 153 L 76 168" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round" />
    <path d="M 144 153 L 124 168" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round" />
    <!-- Yellow buttons -->
    <circle cx="76" cy="168" r="3" fill="#FACC15" />
    <circle cx="124" cy="168" r="3" fill="#FACC15" />

    <!-- Apron Pocket with Logo "RR" -->
    <rect x="85" y="170" width="30" height="24" rx="4" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.5" />
    <text x="100" y="186" font-family="sans-serif" font-weight="900" font-size="12" fill="#FACC15" text-anchor="middle">RR</text>

    <!-- Squeeze Bottle of Garlic/Banana Sauce in Hand -->
    <g transform="translate(130, 142) rotate(20)">
      <rect x="0" y="8" width="16" height="34" rx="4" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" />
      <polygon points="4,8 12,8 8,0" fill="#EF4444" />
      <text x="8" y="28" font-family="sans-serif" font-weight="bold" font-size="8" fill="#78350F" text-anchor="middle">PAPOI</text>
    </g>

    <!-- Left Hand Wave -->
    <circle cx="44" cy="160" r="9" fill="#1F2937" />
  </g>
</svg>

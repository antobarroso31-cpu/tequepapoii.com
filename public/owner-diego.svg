<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="yellowSkinD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE54D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="denimBlueD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="ownerShadowD" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.18" flood-color="#000" />
    </filter>
  </defs>

  <g filter="url(#ownerShadowD)">
    <!-- Pill Body -->
    <rect x="52" y="65" width="96" height="135" rx="48" fill="url(#yellowSkinD)" stroke="#B45309" stroke-width="2.5" />

    <!-- Red Chef Bandana on Head -->
    <path d="M 50 68 Q 100 50 150 68" stroke="#EF4444" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Bandana knot -->
    <circle cx="150" cy="72" r="7" fill="#DC2626" />
    <path d="M 152 74 L 165 85 M 150 76 L 160 93" stroke="#DC2626" stroke-width="4" stroke-linecap="round" />

    <!-- Goggle Strap -->
    <rect x="52" y="98" width="96" height="12" fill="#1F2937" />

    <!-- One Big Goggle Center Eye (Diego - Single Eye / Stuart style) -->
    <circle cx="100" cy="104" r="26" fill="#9CA3AF" stroke="#374151" stroke-width="3.5" />
    <circle cx="100" cy="104" r="20" fill="#FFFFFF" />
    <circle cx="100" cy="104" r="11" fill="#78350F" />
    <circle cx="100" cy="104" r="5" fill="#0F172A" />
    <circle cx="103" cy="101" r="2.5" fill="#FFFFFF" />

    <!-- Excited Big Grin with Teeth -->
    <path d="M 80 142 Q 100 162 120 142 Z" fill="#991B1B" stroke="#78350F" stroke-width="2" />
    <path d="M 86 143 Q 100 148 114 143" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Overalls / Apron -->
    <path d="M 52 165 L 52 200 C 52 215, 62 220, 100 220 C 138 220, 148 215, 148 200 L 148 165 Z" fill="url(#denimBlueD)" stroke="#1E3A8A" stroke-width="2" />
    <rect x="75" y="152" width="50" height="38" rx="4" fill="url(#denimBlueD)" />
    <!-- Straps -->
    <path d="M 58 155 L 77 170" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round" />
    <path d="M 142 155 L 123 170" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round" />
    <!-- Yellow buttons -->
    <circle cx="77" cy="170" r="3" fill="#FACC15" />
    <circle cx="123" cy="170" r="3" fill="#FACC15" />

    <!-- Apron Pocket with Logo "DT" -->
    <rect x="85" y="172" width="30" height="24" rx="4" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.5" />
    <text x="100" y="188" font-family="sans-serif" font-weight="900" font-size="12" fill="#FACC15" text-anchor="middle">DT</text>

    <!-- Frying Skimmer / Basket in Hand with Crispy Tequeños -->
    <path d="M 25 180 L 50 170" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
    <circle cx="24" cy="182" r="16" fill="#475569" stroke="#94A3B8" stroke-width="2" />
    <rect x="14" y="175" width="20" height="6" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="1" />
    <rect x="16" y="183" width="18" height="6" rx="3" fill="#FBBF24" stroke="#B45309" stroke-width="1" />

    <!-- Thumbs up Right Hand -->
    <circle cx="152" cy="168" r="8" fill="#1F2937" />
    <rect x="150" y="158" width="6" height="12" rx="3" fill="#1F2937" />
  </g>
</svg>

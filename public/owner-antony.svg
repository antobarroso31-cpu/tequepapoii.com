<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="yellowSkinA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE54D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="denimBlueA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="ownerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.18" flood-color="#000" />
    </filter>
  </defs>

  <g filter="url(#ownerShadow)">
    <!-- Pill Body -->
    <rect x="50" y="65" width="100" height="135" rx="50" fill="url(#yellowSkinA)" stroke="#B45309" stroke-width="2.5" />

    <!-- Chef Hat -->
    <path d="M 68 66 C 55 20, 85 10, 100 12 C 115 10, 145 20, 132 66 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
    <path d="M 75 42 C 85 24, 115 24, 125 42" stroke="#E2E8F0" stroke-width="2" fill="none" />
    <rect x="66" y="60" width="68" height="10" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Goggle Strap -->
    <rect x="50" y="94" width="100" height="12" fill="#1F2937" />

    <!-- Eyes (Two eyes - Antony) -->
    <!-- Left Eye -->
    <circle cx="80" cy="100" r="19" fill="#9CA3AF" stroke="#374151" stroke-width="3" />
    <circle cx="80" cy="100" r="14" fill="#FFFFFF" />
    <circle cx="80" cy="100" r="8" fill="#78350F" />
    <circle cx="80" cy="100" r="4" fill="#0F172A" />
    <circle cx="82" cy="98" r="2" fill="#FFFFFF" />

    <!-- Right Eye -->
    <circle cx="120" cy="100" r="19" fill="#9CA3AF" stroke="#374151" stroke-width="3" />
    <circle cx="120" cy="100" r="14" fill="#FFFFFF" />
    <circle cx="120" cy="100" r="8" fill="#78350F" />
    <circle cx="120" cy="100" r="4" fill="#0F172A" />
    <circle cx="122" cy="98" r="2" fill="#FFFFFF" />

    <!-- Confident Chef Smile -->
    <path d="M 85 135 Q 100 148 115 135" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Denim Overalls / Apron -->
    <path d="M 50 160 L 50 200 C 50 215, 60 220, 100 220 C 140 220, 150 215, 150 200 L 150 160 Z" fill="url(#denimBlueA)" stroke="#1E3A8A" stroke-width="2" />
    <rect x="75" y="150" width="50" height="40" rx="4" fill="url(#denimBlueA)" />
    <!-- Straps -->
    <path d="M 58 152 L 76 168" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round" />
    <path d="M 142 152 L 124 168" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round" />
    <!-- Yellow buttons -->
    <circle cx="76" cy="168" r="3" fill="#FACC15" />
    <circle cx="124" cy="168" r="3" fill="#FACC15" />

    <!-- Apron Pocket with Logo "A" -->
    <rect x="85" y="172" width="30" height="24" rx="4" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.5" />
    <text x="100" y="188" font-family="sans-serif" font-weight="900" font-size="12" fill="#FACC15" text-anchor="middle">AC</text>

    <!-- Hands holding Tequeño with cheese stretch -->
    <!-- Tequeño Left half -->
    <rect x="30" y="158" width="35" height="12" rx="6" fill="#F59E0B" stroke="#92400E" stroke-width="1.5" transform="rotate(-15 47 164)" />
    <!-- Tequeño Right half -->
    <rect x="135" y="152" width="35" height="12" rx="6" fill="#F59E0B" stroke="#92400E" stroke-width="1.5" transform="rotate(15 152 158)" />
    <!-- Stretched Cheese strand between -->
    <path d="M 58 160 Q 100 178 140 156" stroke="#FEF08A" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 64 163 Q 100 174 135 160" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>
